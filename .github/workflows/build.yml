name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Build IPA
      run: |
        set -euo pipefail
        pwd
        ls -la

        # Crea la struttura dell'app
        mkdir -p Payload/StreamHub.app

        # Crea Info.plist
        cat > Payload/StreamHub.app/Info.plist <<'PLISTEOF'
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>CFBundleDevelopmentRegion</key>
                <string>it</string>
                <key>CFBundleDisplayName</key>
                <string>StreamHub</string>
                <key>CFBundleExecutable</key>
                <string>StreamHub</string>
                <key>CFBundleIdentifier</key>
                <string>com.streamhub.app</string>
                <key>CFBundleInfoDictionaryVersion</key>
                <string>6.0</string>
                <key>CFBundleName</key>
                <string>StreamHub</string>
                <key>CFBundlePackageType</key>
                <string>APPL</string>
                <key>CFBundleShortVersionString</key>
                <string>1.0</string>
                <key>CFBundleVersion</key>
                <string>1</string>
                <key>LSRequiresIPhoneOS</key>
                <true/>
                <key>UIRequiredDeviceCapabilities</key>
                <array>
                    <string>arm64</string>
                </array>
                <key>UIDeviceFamily</key>
                <array>
                    <integer>1</integer>
                    <integer>2</integer>
                </array>
                <key>CFBundleSupportedPlatforms</key>
                <array>
                    <string>iPhoneOS</string>
                </array>
                <key>MinimumOSVersion</key>
                <string>16.0</string>
                <key>UISupportedInterfaceOrientations</key>
                <array>
                    <string>UIInterfaceOrientationPortrait</string>
                    <string>UIInterfaceOrientationLandscapeLeft</string>
                    <string>UIInterfaceOrientationLandscapeRight</string>
                </array>
            </dict>
            </plist>
        PLISTEOF

        # Compila il binario Swift
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk)
        echo "Using SDK_PATH=$SDK_PATH"
        if [ ! -d "$SDK_PATH" ]; then
          echo "SDK path not found: $SDK_PATH"
          exit 1
        fi

        if ! xcrun --sdk iphoneos swiftc -o Payload/StreamHub.app/StreamHub \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            -framework SwiftUI -framework WebKit \
            ios/StreamHubApp.swift; then
          echo "swiftc build failed"
          exit 1
        fi
Sideloadly version 0.60, Windows 10.0, amd64
App successfully prepared for auto-refresh
Using IPA file: C:\Users\Alessandro\AppData\Local\cache\sideloadly\1c4c7db003b322a8f5aa4c9720c59784.ipa: 1c4c7db003b322a8f5aa4c9720c59784
Will use Local Anisette (iTunes Anisette)
Checking iOS version...
iOS version 26.5, will mangle bundleID
Prefetching Anisette...
Sideloadly will be shown in your Apple ID as PC running Windows 10.0(0,0) with serial number DESKTOP-VHA78RR
        chmod +x Payload/StreamHub.app/StreamHub
        file Payload/StreamHub.app/StreamHub || true
        plutil -lint Payload/StreamHub.app/Info.plist || true

        printf 'APPL????' > Payload/StreamHub.app/PkgInfo

        # Crea IPA
        pushd Payload
        find . -maxdepth 2 | sort
        popd
        ditto -c -k --keepParent Payload StreamHub.ipa
        ls -la StreamHub.ipa Payload/StreamHub.app
        if [ ! -f StreamHub.ipa ]; then
          echo "IPA not created"
          exit 1
        fi
        unzip -t StreamHub.ipa
        unzip -l StreamHub.ipa | head -40
        file StreamHub.ipa || true
        ls -la Payload/StreamHub.app/StreamHub
        file Payload/StreamHub.app/StreamHub || true
        if [ -f StreamHub.ipa ]; then echo "IPA created"; else echo "IPA missing"; exit 1; fi
        
    - name: Upload IPA
      uses: actions/upload-artifact@v5
      with:
        name: StreamHub.ipa
        path: StreamHub.ipa
