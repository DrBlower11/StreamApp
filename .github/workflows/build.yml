name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build IPA
      run: |
        set -euo pipefail

        # Crea struttura
        mkdir -p Payload/StreamHub.app

        # Copia Info.plist dal repo (evita problemi YAML con heredoc)
        cp ios/Info.plist Payload/StreamHub.app/Info.plist
        plutil -lint Payload/StreamHub.app/Info.plist

        # Compila
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK: $SDK_PATH"

        xcrun --sdk iphoneos swiftc \
          -o Payload/StreamHub.app/StreamHub \
          -sdk "$SDK_PATH" \
          -target arm64-apple-ios16.0 \
          -parse-as-library \
          -framework SwiftUI \
          -framework WebKit \
          ios/StreamHubApp.swift

        chmod +x Payload/StreamHub.app/StreamHub
        file Payload/StreamHub.app/StreamHub

        # PkgInfo (8 byte esatti)
        printf 'APPL????' > Payload/StreamHub.app/PkgInfo

        # Firma ad-hoc (obbligatoria per Sideloadly)
        codesign --force --sign - Payload/StreamHub.app/StreamHub
        codesign --force --deep --sign - Payload/StreamHub.app
        codesign --verify --verbose Payload/StreamHub.app

        # Struttura finale
        find Payload -maxdepth 3 | sort

        # Crea IPA
        ditto -c -k --keepParent Payload StreamHub.ipa
        ls -lh StreamHub.ipa
        unzip -t StreamHub.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: StreamHub.ipa
        path: StreamHub.ipa
