name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'
    
    - name: Build IPA
      run: |
        mkdir -p Payload/StreamHub.app
        cp StreamHubApp.swift Payload/StreamHub.app/
        xcodebuild -create-xcframework -output StreamHub.xcframework
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: StreamHub.ipa
        path: "*.ipa"
